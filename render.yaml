services:
  - type: web
    name: homologacion-clinica
    runtime: python
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /data
      - key: APP_PASSWORD
        sync: false
    disk:
      name: homologacion-data
      mountPath: /data
      sizeGB: 10
